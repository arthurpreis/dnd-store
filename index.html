<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Catalog</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body id="body">
    <header>
      <h1>Product Catalog</h1>
      <p>Explore our adventuring store</p>
    </header>

    <main class="layout">
      <section>
        <div>
          <label for="search">Search items</label>
          <input id="search" type="search" placeholder="Type a word" />

          <button id="search-button" type="submit">Search</button>
        </div>
      </section>
      <!-- MAIN EXERCISE: PRODUCT TABLE -->
      <section class="catalog">
        <h2>Available Products</h2>
        <div id="product-count"></div>
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Category</th>
              <th>Price</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="products-body">
            <!-- Generate product rows using JavaScript -->
          </tbody>
        </table>
      </section>

      <!-- BONUS 1: PRODUCT DETAILS -->
      <aside id="details-panel" hidden>
        <h2>Product Details</h2>
        <div id="details-content">
          <!-- Generate details of the selected product using JavaScript -->
        </div>
      </aside>
    </main>
  </body>
</html>
